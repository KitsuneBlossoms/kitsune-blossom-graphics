<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090609">
<title>Product Details | Kitsune Blossom Graphics</title>
<style>
:root{--pink:#ff168b;--pink2:#ff79ba;--black:#090609;--panel:#171018;--white:#fff7fc;--muted:#cbbbc6}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.topline{height:4px;background:linear-gradient(90deg,#ff168b,#ff9bd0,#fff,#ff168b)}header{position:sticky;top:0;z-index:5;background:rgba(9,6,9,.95);backdrop-filter:blur(10px);border-bottom:1px solid #482039}.nav{max-width:1180px;margin:auto;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:900;letter-spacing:1px;text-transform:uppercase;font-size:14px}.brand span{color:var(--pink)}nav{display:flex;gap:22px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px}nav a:hover,.back:hover{color:var(--pink2)}.wrap{max-width:1050px;margin:auto;padding:0 22px}.back{display:inline-block;color:var(--pink2);margin:30px 0 20px;font-size:13px}.product{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:start;padding:10px 0 75px}.photo{background:radial-gradient(circle at center,rgba(255,22,139,.15),#100a10 70%);border:1px solid #46213a;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--pink2);font-size:70px}.photo img{width:100%;height:100%;object-fit:cover}.category{color:var(--pink);font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:bold}.name{font-size:clamp(30px,4vw,46px);line-height:1.1;text-transform:uppercase;margin:10px 0}.price{font-size:28px;font-weight:900;color:var(--pink2);margin:15px 0}.desc{color:var(--muted);white-space:pre-wrap}.status{display:inline-block;border:1px solid #8d3c68;padding:5px 9px;color:#ffd4e9;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:8px 0 18px}.field{margin:17px 0}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#f8d6e8;margin-bottom:7px}input,select,textarea{width:100%;background:#110b11;color:white;border:1px solid #63314f;padding:12px 14px;font:inherit;min-height:46px}textarea{min-height:90px;resize:vertical}.hint{font-size:11px;color:var(--muted);margin-top:6px}.button{display:inline-block;background:var(--pink);color:white;border:0;padding:14px 22px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;cursor:pointer;margin-top:10px}.button:hover{background:#d90d73}.button:disabled{opacity:.45;cursor:not-allowed}.fine{font-size:12px;color:var(--muted);margin-top:12px}footer{border-top:1px solid #3c1a30;padding:25px;text-align:center;color:#bba9b5;font-size:12px}footer b{color:var(--pink)}.error{padding:35px;text-align:center;border:1px dashed #693451;background:#110b11;color:var(--muted)}@media(max-width:700px){.product{grid-template-columns:1fr;gap:24px}.nav{padding:13px 14px}nav{gap:12px;font-size:10px}.brand{font-size:11px}}
</style>
</head>
<body><div class="topline"></div><header><div class="nav"><a class="brand" href="index.html">Kitsune <span>Blossom</span> Graphics</a><nav><a href="index.html">Home</a><a href="shop.html">Shop collection</a><a href="cart.html">Cart 🛒</a><a href="index.html#custom">Custom orders</a></nav></div></header>
<main class="wrap"><a class="back" href="shop.html">← Back to the collection</a><section id="content" class="error">Loading product details… 🌸</section></main>
<footer>© <span id="year"></span> <b>Kitsune Blossom Graphics</b> · Made to bloom. Built to stand out.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const root=document.getElementById('content');document.getElementById('year').textContent=new Date().getFullYear();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD'});}
function showError(message){root.className='error';root.textContent=message;}
async function loadProduct(){
 const id=new URLSearchParams(location.search).get('id');if(!id){showError('We couldn’t find that product. Please return to the collection.');return;}
 try{
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data:p,error}=await db.from('products').select('id,name,description,price,category,image_url,available,published,customizable').eq('id',id).eq('published',true).single();
  if(error||!p)throw error||new Error('Product not found');
  const customizable=p.customizable!==false;
  const isDecal=customizable && String(p.category||'').toLowerCase()==='decals';
  const sizes=[{name:'Small',price:5},{name:'Medium',price:10},{name:'Large',price:15}];
  const photo=p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'✿';
  root.className='product';
  root.innerHTML='<div class="photo">'+photo+'</div><div><div class="category">'+esc(p.category||'Other')+'</div><h1 class="name">'+esc(p.name)+'</h1><div class="price" id="price">'+money(p.price)+'</div><span class="status">'+(p.available?'Available':'Currently unavailable')+'</span><p class="desc">'+esc(p.description||'Made with care, just for you.')+'</p>'+
   (isDecal?'<div class="field"><label for="size">Choose decal size</label><select id="size">'+sizes.map(s=>'<option value="'+s.name+'" data-price="'+s.price+'">'+s.name+' — '+money(s.price)+'</option>').join('')+'</select><div class="hint">Small $5 · Medium $10 · Large $15</div></div>':'')+
   (customizable?'<div class="field"><label for="color">Color preference</label><input id="color" maxlength="100" placeholder="Tell us your preferred color"></div>':'')+
   '<div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="99" value="1"></div>'+
   (customizable?'<div class="field"><label for="notes">Customization details (optional)</label><textarea id="notes" maxlength="1000" placeholder="Tell us what you have in mind…"></textarea></div>':'<p class="hint">This is a ready-made design and cannot be customized.</p>')+
   '<button class="button" id="addCart" '+(!p.available?'disabled':'')+'>Add to cart</button><p class="fine">Secure checkout is available for US orders. Decal-only shipping is $5; other orders under $50 are $10; orders $50+ ship free.</p><p class="fine"><a href="cart.html" style="color:#ff79ba">View cart</a> · <a href="index.html#custom" style="color:#ff79ba">Need a custom request?</a></p></div>';
  const priceEl=document.getElementById('price');const sizeEl=document.getElementById('size');if(sizeEl)sizeEl.addEventListener('change',()=>{priceEl.textContent=money(sizeEl.selectedOptions[0].dataset.price);});
  document.getElementById('addCart').addEventListener('click',()=>{
   const cart=JSON.parse(localStorage.getItem('kbg_cart')||'[]');
   cart.push({id:p.id,name:p.name,price:Number(p.price),category:p.category||'Other',image_url:p.image_url||'',quantity:Math.max(1,Math.min(99,Number(document.getElementById('quantity').value)||1)),...(sizeEl?{size:sizeEl.value}:{}),...(customizable?{color:document.getElementById('color').value,notes:document.getElementById('notes').value}:{})});
   localStorage.setItem('kbg_cart',JSON.stringify(cart));location.href='cart.html';
  });
 }catch(e){console.error(e);showError('We couldn’t load that product. It may have been removed or hidden. Please return to the collection.');}
}
loadProduct();
</script></body></html>
